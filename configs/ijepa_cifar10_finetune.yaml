command: finetune
dataset: cifar10
data_dir: datasets
output_dir: runs
run_name: ijepa_cifar10_finetune
checkpoint: runs/ijepa_cifar10_pretrain/checkpoints/ijepa_pretrain_last.pt

fine_tuning:
  freeze_encoder: true
  max_val_batches:

training:
  batch_size: 1024
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.05
  num_workers: 2
  device: auto
  seed: 42
  grad_clip_norm: 1.0
  cli_log_every_steps: 20
  color_cli: true
  live_full_cli: true
  max_train_batches:
