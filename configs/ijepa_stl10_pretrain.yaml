command: pretrain
dataset: stl10
data_dir: datasets
output_dir: runs
run_name: ijepa_stl10_pretrain

model:
  image_size: 96
  patch_size: 8
  embed_dim: 192
  depth: 6
  num_heads: 3
  mlp_ratio: 4.0

jepa:
  context_ratio: 0.6
  ema_tau: 0.996

training:
  batch_size: 128
  epochs: 50
  learning_rate: 0.0005
  weight_decay: 0.05
  num_workers: 4
  device: auto
  seed: 42
  grad_clip_norm: 1.0
  cli_log_every_steps: 20
  color_cli: true
  live_full_cli: true
  max_train_batches:
