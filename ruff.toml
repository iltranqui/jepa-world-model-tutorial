target-version = "py314"
line-length = 120
preview = true
fix = true

[lint]
select = ["ALL"]

ignore = [
    "COM812", # Recommended ignore from ruff-format
    "CPY001", # No copyright added yet
    "D203",   # One blank line before class (Google prefers no extra line)
    "D213",   # Multi-line docstring summary on first line
    "E501",   # Line length handled by formatter guidance
    "FIX002", # Allow ToDo comments
    "TRY301", # Allow to raise Exceptions within try blocks
]

pydocstyle.convention = "google"

[lint.per-file-ignores]
"setup.py" = ["PLC0415", "S404", "S603"]
"experiments/ijepa_image_run.py" = [
    "ANN401", # YAML/checkpoint payloads are dynamically typed at the boundary
    "C901",   # CLI metric grading is a compact heuristic dispatcher
    "D102",   # PyTorch forward/reset methods are conventional enough here
    "D107",   # PyTorch module initializers are documented by class context
    "DOC201", # Keep this runnable script's docstrings compact
    "DOC402", # Generator intent is clear from the function name
    "DOC501", # CLI validation errors are straightforward
    "N812",   # torch.nn.functional as F is the PyTorch convention
    "PIE810", # Readability is clearer with explicit metric suffix checks
    "PLR0913", # Model/data builder signatures mirror hyperparameter configs
    "PLR0914", # Training entry points keep local state explicit
    "PLR0915", # Training entry points stay explicit to keep the loop inspectable
    "PLR0911", # Metric grading maps several independent heuristics
    "PLR2004", # Metric grading thresholds are documented in place
    "T201",   # CLI scripts report progress and output paths with print
    "TC003",  # Runtime import is acceptable for this single-file script
]
"experiments/vjepa_lego_gears_run.py" = [
    "ANN401", # YAML/checkpoint payloads are dynamically typed at the boundary
    "C901",   # CLI commands and metric dispatchers are intentionally explicit
    "D102",   # PyTorch forward methods are conventional enough here
    "D105",   # Dataset magic methods are conventional enough here
    "D107",   # PyTorch module initializers are documented by class context
    "DOC201", # Keep runnable script docstrings compact
    "DOC402", # Generator intent is clear from the function name
    "DOC501", # CLI validation errors are straightforward
    "N812",   # torch.nn.functional as F is the PyTorch convention
    "PLR0912", # Training/eval branches are easier to inspect in one local flow
    "PLR0913", # Model/data builder signatures mirror hyperparameter configs
    "PLR0914", # Training entry points keep local state explicit
    "PLR0915", # Training entry points stay explicit to keep the loop inspectable
    "PLR0911", # Metric grading maps several independent heuristics
    "PLR2004", # Metric grading thresholds are documented in place
    "S404",   # subprocess is needed for ffmpeg frame extraction
    "S603",   # ffmpeg is invoked as a list without shell expansion
    "T201",   # CLI scripts report progress and output paths with print
    "TC003",  # Runtime imports are acceptable for this single-file script
]

[format]
preview = true
